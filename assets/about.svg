<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="About AKCybex">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f0d16"/><stop offset="100%" stop-color="#1b1526"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5fb8e8"/><stop offset="50%" stop-color="#6b5fb8"/><stop offset="100%" stop-color="#b56fb8"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
    <clipPath id="round"><rect width="1200" height="230" rx="24"/></clipPath>
  </defs>
<g clip-path="url(#round)"><rect width="1200" height="230" fill="url(#bg)"/><rect width="1200" height="230" fill="url(#grid)"/>
<rect x="40" y="40" width="6" height="150" rx="3" fill="url(#accent)"/>
<text x="70" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Who we are</text>
<text x="70" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#c9c4d6">AKCybex is a software development and IT services company. We partner with startups and established</text>
<text x="70" y="132" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#c9c4d6">businesses to take products from idea to production, and we build and operate our own SaaS products along the way.</text>
<text x="70" y="154" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#c9c4d6"></text>
<text x="70" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#c9c4d6">Everything we learn while shipping client and product work flows back into our open-source libraries,</text>
<text x="70" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#c9c4d6">which anyone is free to use.</text>
</g></svg>